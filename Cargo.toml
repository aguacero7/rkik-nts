[package]
name = "rkik-nts"
version = "1.0.0"
edition = "2021"
rust-version = "1.70"
authors = ["Aguacero7 <naps@teamnaps.fr>"]
license = "GPL-2.0-or-later"
description = "High-level NTS (Network Time Security) client library (RFC 8915)"
repository = "https://github.com/aguacero7/rkik-nts"
keywords = ["nts", "ntp", "time", "time-security", "client"]
categories = ["network-programming", "date-and-time"]
readme = "README.md"

[dependencies]
aes-siv = "0.7"
rand = "0.8"
tokio = { version = "1.40", features = ["net", "time", "rt-multi-thread", "macros", "io-util"] }
tokio-rustls = "0.26"
rustls = { version = "0.23", features = ["ring"] }
rustls-native-certs = "0.8"
webpki-roots = "1.0.4"
thiserror = "2.0.17"
tracing = "0.1.43"
tracing-subscriber = { version = "0.3", optional = true }
serde = { version = "1.0", features = ["derive"], optional = true }
x509-parser = "0.18"
sha2 = "0.10"
chrono = "0.4"

[dev-dependencies]
tokio-test = "0.4"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[features]
default = []
serde = ["dep:serde"]
tracing-subscriber = ["dep:tracing-subscriber"]
network-tests = []

[lib]
name = "rkik_nts"
path = "src/lib.rs"

[[example]]
name = "simple_client"
path = "examples/simple_client.rs"
required-features = ["tracing-subscriber"]

[[example]]
name = "custom_config"
path = "examples/custom_config.rs"
required-features = ["tracing-subscriber"]

[[example]]
name = "rkik_diagnostics"
path = "examples/rkik_diagnostics.rs"
required-features = ["tracing-subscriber"]

[[example]]
name = "nts_ke_sslkeylog"
path = "examples/nts_ke_sslkeylog.rs"
required-features = ["tracing-subscriber"]

[[example]]
name = "test_certificate"
path = "examples/test_certificate.rs"
required-features = ["tracing-subscriber"]

[[example]]
name = "nts_end_to_end"
path = "examples/nts_end_to_end.rs"
required-features = ["tracing-subscriber"]
